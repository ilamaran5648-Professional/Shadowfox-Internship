<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Study With Buddy — Your AI study companion</title>
  <meta name="description" content="Paste your notes and let Study Buddy summarize them, quiz you, or sharpen your answers.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Space+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

  <header class="site-header" id="siteHeader">
    <nav class="nav">
      <a href="{{ url_for('index') }}" class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        Study With Buddy
      </a>
      <ul class="nav-links">
        <li><a href="#how-it-works">How it works</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="hero">
      <p class="hero-eyebrow">AI study companion</p>
      <h1>Your notes, <em>get understood</em>.</h1>
    </section>

    <section class="desk" id="desk">
      <div class="desk-card">
        <form action="{{ url_for('result') }}" method="post" id="studyForm">
          <label class="field-label" for="notes">
            <span>Your notes</span>
            <span id="word-count">0 words</span>
          </label>
          <textarea
            id="notes"
            name="notes"
            placeholder="Paste your class notes, textbook excerpt, or rough answer here…"
            required
            aria-describedby="notesHint"
          ></textarea>
          <p class="hint" id="notesHint">Works best with 50–2,000 words at a time.</p>

          <div class="button-group" role="group" aria-label="Choose an action">
            <button class="btn btn-primary" type="submit" name="action" value="summarize">
              <span class="switch-dot" aria-hidden="true"></span>
              <span class="btn-label">Summarize</span>
              <span class="spinner" aria-hidden="true"></span>
            </button>
            <button class="btn" type="submit" name="action" value="quiz">
              <span class="switch-dot" aria-hidden="true"></span>
              <span class="btn-label">Short Quiz</span>
              <span class="spinner" aria-hidden="true"></span>
            </button>
            <button class="btn" type="submit" name="action" value="better_answer">
              <span class="switch-dot" aria-hidden="true"></span>
              <span class="btn-label">Better Answer</span>
              <span class="spinner" aria-hidden="true"></span>
            </button>
          </div>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">Study Buddy — built for late-night study sessions.</footer>

  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
